name: Terek Drive Unity Android

on:
  push:
    branches: ["unity-graphics-prototype"]
    paths:
      - "unity/**"
      - ".github/workflows/unity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BuildAndroid.Build
          versioning: None

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: TerekDrive-Unity-Android
          path: unity/Builds/TerekDrive.apk
          if-no-files-found: error
