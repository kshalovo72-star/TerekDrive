name: Terek Drive Godot Android

on:
  push:
    branches: ["godot-graphics-prototype"]
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Install export templates
        run: godot --headless --editor --quit --path godot --install-android-template
      - name: Export Android APK
        run: mkdir -p godot/build && godot --headless --path godot --export-debug "Android" godot/build/TerekDrive-Godot-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerekDrive-Godot-debug
          path: godot/build/TerekDrive-Godot-debug.apk
