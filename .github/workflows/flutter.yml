name: Terek Drive Flutter
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        working-directory: flutter
        run: flutter create --platforms=android --org com.terekdrive --project-name terek_drive .
      - name: Dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Test
        working-directory: flutter
        run: flutter test
      - name: Build debug APK
        working-directory: flutter
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerekDrive-Flutter-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
